<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagramフォロワー爆増</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            padding: 20px;
            text-align: center;
            user-select: none;
            cursor: pointer;
            position: relative;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .uid-badge {
            display: inline-block;
            background: rgba(0,0,0,0.25);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
        
        /* 管理者パネルスタイル */
        .admin-panel {
            display: none;
            background: #222;
            color: #fff;
            padding: 15px;
            border-bottom: 2px solid #dc2743;
            font-size: 12px;
        }

        .admin-panel h3 {
            color: #fcb045;
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .admin-btn {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
        }

        .admin-btn:hover {
            background: #555;
        }

        .admin-btn.active {
            background: #22c55e;
            border-color: #16a34a;
        }

        .instagram-preview {
            background: #fafafa;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .avatar-box {
            position: relative;
            width: 75px;
            height: 75px;
            margin-right: 15px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            font-weight: bold;
            object-fit: cover;
        }
        
        .profile-info {
            text-align: left;
            overflow: hidden;
        }
        
        .profile-name {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 3px;
            word-break: break-all;
        }

        .avatar-hint {
            font-size: 11px;
            color: #888;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #efefef;
        }
        
        .stat-item {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 2px;
            color: #262626;
        }
        
        .stat-label {
            font-size: 11px;
            color: #8e8e8e;
        }
        
        .simulation-controls {
            padding: 20px;
            background: white;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #262626;
        }

        .input-group .sub-note {
            font-size: 11px;
            color: #e6683c;
            font-weight: normal;
            margin-top: 2px;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #0095f6;
        }

        .flex-inputs {
            display: flex;
            gap: 10px;
        }

        .flex-inputs .input-group {
            flex: 1;
        }
        
        .warning-banner {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            transform: translateX(180%);
            transition: transform 0.3s ease-in-out;
            max-width: 320px;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification-content {
            display: flex;
            align-items: center;
        }
        
        .notification-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            margin-right: 10px;
            flex-shrink: 0;
        }
        
        .notification-text {
            font-size: 13px;
            color: #262626;
            font-weight: 500;
        }
        
        .progress-bar {
            height: 6px;
            background: #f0f0f0;
            width: 100%;
            margin-top: 15px;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            width: 0%;
            transition: width 0.1s;
        }
        
        .disclaimer {
            padding: 12px;
            background: #f9f9f9;
            font-size: 11px;
            color: #8e8e8e;
            text-align: center;
            border-top: 1px solid #efefef;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー（特定UIDのみ5回タップで管理者パネル） -->
        <div class="header" id="headerTitle">
            <h1>Instagramフォロワー爆増</h1>
            <p></p>
            <div class="uid-badge">ID: {{ uid }}</div>
        </div>
        
        <!-- 隠し管理者パネル -->
        <div class="admin-panel" id="adminPanel">
            <h3>⚙️ 管理者制御パネル <span style="font-size:10px; cursor:pointer;" onclick="toggleAdminPanel()">✖ 閉じる</span></h3>
            <div class="admin-grid">
                <button class="admin-btn" id="btnUnlockLimit" onclick="toggleLimitUnlock()">上限1000制限: 有効</button>
                <button class="admin-btn" onclick="clearRateLimit()">回数制限クリア</button>
                <button class="admin-btn" onclick="window.open('/admin/logs', '_blank')">📋 実行ログ閲覧</button>
                <button class="admin-btn" onclick="resetAllAdmin()">全初期化</button>
            </div>
            <div style="font-size:10px; color:#aaa;">※ タイトル5回タップでこのパネルを開閉できます</div>
        </div>

        <div class="instagram-preview">
            <div class="profile-header">
                <div class="avatar-box" onclick="document.getElementById('fileInput').click()">
                    <div class="profile-pic" id="profilePic">D</div>
                    <img id="avatarImage" class="profile-pic" style="display:none;" alt="アイコン">
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="changeAvatar(event)">

                <div class="profile-info">
                    <div class="profile-name" id="profileName">demo_user</div>
                    <div class="avatar-hint"></div>
                </div>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="followerCount" style="color: #dc2743;">128</div>
                    <div class="stat-label">フォロワー</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="followingCount">256</div>
                    <div class="stat-label">フォロー中</div>
                </div>
            </div>
        </div>
        
        <div class="simulation-controls">
            <div class="input-group">
                <label for="username">ユーザー名</label>
                <input type="text" id="username" placeholder="例: user123" value="demo_user">
            </div>

            <div class="flex-inputs">
                <div class="input-group">
                    <label for="initialFollowers">現在のフォロワー</label>
                    <input type="number" id="initialFollowers" value="128">
                    <div class="sub-note">※違う数値を入力した場合はエラーの原因になります</div>
                </div>
                <div class="input-group">
                    <label for="initialFollowing">フォロー中</label>
                    <input type="number" id="initialFollowing" value="256">
                    <div class="sub-note">※違う数値を入力した場合はエラーの原因になります</div>
                </div>
            </div>
            
            <div class="input-group">
                <label for="targetFollowers">目標フォロワー数</label>
                <input type="number" id="targetFollowers" placeholder="上限1000まで" value="1000">
            </div>
            
            <div class="input-group">
                <label for="growthSpeed">増加速度</label>
                <input type="range" id="growthSpeed" min="1" max="10" value="5" style="width: 100%;">
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: #8e8e8e; margin-top: 4px;">
                    <span>遅い</span>
                    <span>速い</span>
                </div>
            </div>

            <div class="warning-banner">
                ⚠️ スピードが速すぎる場合アカウント凍結の可能性があります。
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" id="startBtn">フォロワー増加開始</button>
                <button class="btn btn-secondary" id="resetBtn">リセット</button>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="disclaimer">
            フォロワーボットを作動し、作業が完了してもインスタグラムに反映されるまで時間がかかる場合があります。
        </div>
    </div>
    
    <div class="notification" id="notification">
        <div class="notification-content">
            <div class="notification-icon">✓</div>
            <div class="notification-text" id="notificationText">フォロワーが増加しました！</div>
        </div>
    </div>
    
    <script>
        // ★ 管理者専用UID
        const ADMIN_UID = 'UID_546d63df';

        const profileName = document.getElementById('profileName');
        const profilePic = document.getElementById('profilePic');
        const followerCount = document.getElementById('followerCount');
        const followingCount = document.getElementById('followingCount');
        
        const usernameInput = document.getElementById('username');
        const initialFollowersInput = document.getElementById('initialFollowers');
        const initialFollowingInput = document.getElementById('initialFollowing');
        const targetFollowersInput = document.getElementById('targetFollowers');
        const growthSpeedInput = document.getElementById('growthSpeed');
        
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        const progressFill = document.getElementById('progressFill');

        // 管理者関連
        const headerTitle = document.getElementById('headerTitle');
        const adminPanel = document.getElementById('adminPanel');
        const btnUnlockLimit = document.getElementById('btnUnlockLimit');
        
        let currentFollowers = 128;
        let targetFollowers = 1000;
        let isSimulationRunning = false;
        let simulationInterval;
        let notificationTimeout;

        let tapCount = 0;
        let tapTimer = null;
        let limitUnlocked = false;

        // イベントリスナー
        startBtn.addEventListener('click', startSimulation);
        resetBtn.addEventListener('click', resetSimulation);
        usernameInput.addEventListener('input', updateProfile);
        initialFollowersInput.addEventListener('input', updateStats);
        initialFollowingInput.addEventListener('input', updateStats);
        
        // ヘッダー5回タップ判定
        headerTitle.addEventListener('click', () => {
            tapCount++;
            if (tapTimer) clearTimeout(tapTimer);
            tapTimer = setTimeout(() => { tapCount = 0; }, 1500);

            if (tapCount >= 5) {
                toggleAdminPanel();
                tapCount = 0;
            }
        });

        // ショートカットキー (Ctrl + Shift + A)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
                toggleAdminPanel();
            }
        });

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function toggleAdminPanel() {
            const currentUid = getCookie('user_uid');
            
            // あなたのUID以外は起動しない
            if (currentUid !== ADMIN_UID) {
                showNotification('❌ 管理者権限がありません');
                return;
            }

            if (adminPanel.style.display === 'block') {
                adminPanel.style.display = 'none';
            } else {
                adminPanel.style.display = 'block';
                showNotification('⚙️ 管理者モードを起動しました');
            }
        }

        function toggleLimitUnlock() {
            limitUnlocked = !limitUnlocked;
            if (limitUnlocked) {
                btnUnlockLimit.innerText = '上限1000制限: 解除済み';
                btnUnlockLimit.classList.add('active');
                targetFollowersInput.placeholder = '制限なし';
                showNotification('管理者権限: 目標数の1000制限を解除しました');
            } else {
                btnUnlockLimit.innerText = '上限1000制限: 有効';
                btnUnlockLimit.classList.remove('active');
                targetFollowersInput.placeholder = '上限1000まで';
                showNotification('目標数の1000制限を有効化しました');
            }
        }

        function clearRateLimit() {
            localStorage.removeItem('sim_history');
            showNotification('管理者権限: 1時間あたりの実行回数制限をリセットしました');
        }

        function resetAllAdmin() {
            clearRateLimit();
            limitUnlocked = false;
            btnUnlockLimit.innerText = '上限1000制限: 有効';
            btnUnlockLimit.classList.remove('active');
            resetSimulation();
            showNotification('管理者設定を初期化しました');
        }

        function updateProfile() {
            const val = usernameInput.value.trim().replace('@', '');
            profileName.textContent = val ? '@' + val : '@demo_user';
            if (val) {
                profilePic.textContent = val.charAt(0).toUpperCase();
            }
        }

        function updateStats() {
            if (!isSimulationRunning) {
                currentFollowers = parseInt(initialFollowersInput.value) || 0;
                followerCount.textContent = currentFollowers.toLocaleString();
                followingCount.textContent = (parseInt(initialFollowingInput.value) || 0).toLocaleString();
            }
        }

        function changeAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = document.getElementById('avatarImage');
                    img.src = evt.target.result;
                    img.style.display = 'flex';
                    profilePic.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        function checkRateLimit() {
            const now = Date.now();
            const history = JSON.parse(localStorage.getItem('sim_history') || '[]');
            const recent = history.filter(time => now - time < 3600000);
            
            if (recent.length >= 3) {
                return false;
            }
            recent.push(now);
            localStorage.setItem('sim_history', JSON.stringify(recent));
            return true;
        }

        function sendLogToServer(targetValue, inputUsername) {
            fetch('/api/log_simulation', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: inputUsername,
                    target: targetValue
                })
            }).catch(err => console.error('Log save error:', err));
        }
        
        function startSimulation() {
            if (isSimulationRunning) return;

            targetFollowers = parseInt(targetFollowersInput.value) || 0;

            if (!limitUnlocked && targetFollowers > 1000) {
                showNotification('数値が高すぎます（目標は1,000までに設定してください）');
                return;
            }

            if (targetFollowers <= currentFollowers) {
                showNotification('目標数は現在のフォロワー数より大きく設定してください');
                return;
            }

            if (!checkRateLimit()) {
                showNotification('エラー: 1時間に利用できるのは3回までです。時間を置いてお試しください。');
                return;
            }

            sendLogToServer(targetFollowers, usernameInput.value);

            isSimulationRunning = true;
            startBtn.textContent = '実行中...';
            startBtn.disabled = true;
            initialFollowersInput.disabled = true;
            initialFollowingInput.disabled = true;
            
            showNotification('フォロワー増加を開始しました！');
            
            const speed = 11 - parseInt(growthSpeedInput.value);
            const interval = speed * 25;
            const startAmount = currentFollowers;
            
            simulationInterval = setInterval(() => {
                if (currentFollowers >= targetFollowers) {
                    clearInterval(simulationInterval);
                    isSimulationRunning = false;
                    startBtn.textContent = 'フォロワー増加完了';
                    showNotification(`目標の ${targetFollowers.toLocaleString()} 人に達しました！`);
                    return;
                }
                
                const increment = Math.floor(Math.random() * 3) + 1;
                currentFollowers = Math.min(currentFollowers + increment, targetFollowers);
                
                followerCount.textContent = currentFollowers.toLocaleString();
                
                const progress = ((currentFollowers - startAmount) / (targetFollowers - startAmount)) * 100;
                progressFill.style.width = `${Math.min(progress, 100)}%`;
                
            }, interval);
        }
        
        function resetSimulation() {
            if (simulationInterval) {
                clearInterval(simulationInterval);
            }
            
            isSimulationRunning = false;
            startBtn.textContent = 'フォローボット作動';
            startBtn.disabled = false;
            initialFollowersInput.disabled = false;
            initialFollowingInput.disabled = false;
            
            updateStats();
            progressFill.style.width = '0%';
            
            showNotification('シミュレーションをリセットしました');
        }
        
        function showNotification(message) {
            if (notificationTimeout) clearTimeout(notificationTimeout);
            
            notificationText.textContent = message;
            notification.classList.add('show');
            
            notificationTimeout = setTimeout(() => {
                notification.classList.remove('show');
            }, 3500);
        }

        updateProfile();
        updateStats();
    </script>
</body>
</html>
