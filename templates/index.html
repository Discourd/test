<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram フォロワー増加シミュレーター</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #121212; border: 1px solid #262626; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; background: #262626; border: 1px solid #363636; border-radius: 8px; padding: 12px; color: #fff; font-size: 14px; outline: none; }
        input[type="text"]:focus { border-color: #0095f6; }
        button.btn-search { background: #0095f6; color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-weight: bold; cursor: pointer; }
        button.btn-search:hover { background: #1877f2; }
        .error-msg { color: #ef4444; font-size: 13px; margin-bottom: 15px; text-align: center; display: none; }
        
        /* プロフィール領域 */
        .profile-section { display: none; margin-top: 10px; }
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .profile-pic { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #e1306c; }
        .profile-info { flex: 1; }
        .username { font-weight: bold; font-size: 18px; }
        .full-name { color: #a8a8a8; font-size: 13px; margin-top: 2px; }
        .tag { display: inline-block; background: #262626; color: #10b981; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; margin-top: 6px; }

        /* カウンター */
        .counter-box { background: #000; border: 1px solid #262626; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .counter-label { font-size: 12px; color: #a8a8a8; text-transform: uppercase; letter-spacing: 1px; }
        .counter-num { font-size: 38px; font-weight: 800; color: #fff; margin: 5px 0; font-variant-numeric: tabular-nums; }
        .counter-status { font-size: 12px; color: #10b981; font-weight: bold; }

        /* 操作ボタン */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .btn { border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-start { background: #10b981; color: #fff; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-boost { grid-column: span 2; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; }

        /* ログ */
        .logs { max-height: 120px; overflow-y: auto; font-size: 12px; color: #a8a8a8; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #262626; padding-top: 12px; margin-top: 15px; }
        .log-item { display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="card">
        <h1>フォロワー増加シミュレーター</h1>
        
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Instagram IDを入力 (例: zuck)">
            <button class="btn-search" onclick="searchUser()">検索</button>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <div id="profileSection" class="profile-section">
            <div class="profile-header">
                <img id="profilePic" class="profile-pic" src="" alt="アイコン">
                <div class="profile-info">
                    <div id="displayUsername" class="username">@</div>
                    <div id="displayFullName" class="full-name"></div>
                    <span class="tag">SIMULATION ACTIVE</span>
                </div>
            </div>

            <div class="counter-box">
                <div class="counter-label">フォロワー数</div>
                <div id="counterNum" class="counter-num">1,000</div>
                <div id="counterStatus" class="counter-status">待機中</div>
            </div>

            <div class="controls">
                <button class="btn btn-start" onclick="startSim()">▶ 増加開始</button>
                <button class="btn btn-stop" onclick="stopSim()">⏸ 一時停止</button>
                <button class="btn btn-boost" onclick="addBoost()">⚡ +1,000人 一撃投入</button>
            </div>

            <div id="logs" class="logs">
                <div class="log-item"><span>システム</span><span>準備完了</span></div>
            </div>
        </div>
    </div>

    <script>
        let currentFollowers = 1000;
        let timer = null;

        async function searchUser() {
            const input = document.getElementById('usernameInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const profileSection = document.getElementById('profileSection');
            
            errorMsg.style.display = 'none';
            stopSim();

            if (!input) {
                showError('IDを入力してください。');
                return;
            }

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: input })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('profilePic').src = data.profile_pic;
                    document.getElementById('displayUsername').innerText = '@' + data.username;
                    document.getElementById('displayFullName').innerText = data.full_name;
                    
                    currentFollowers = data.initial_followers;
                    updateCounter();
                    
                    profileSection.style.display = 'block';
                    addLog('システム', `@${data.username} の検出に成功しました`);
                } else {
                    profileSection.style.display = 'none';
                    showError(data.error);
                }
            } catch (err) {
                showError('通信エラーが発生しました。');
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg;
            el.style.display = 'block';
        }

        function updateCounter() {
            document.getElementById('counterNum').innerText = currentFollowers.toLocaleString();
        }

        function startSim() {
            if (timer) return;
            document.getElementById('counterStatus').innerText = '▲ フォロワー増加中...';
            timer = setInterval(() => {
                const add = Math.floor(Math.random() * 5) + 1;
                currentFollowers += add;
                updateCounter();
                addLog('新規フォロー', `+${add} 人`);
            }, 500);
        }

        function stopSim() {
            if (timer) {
                clearInterval(timer);
                timer = null;
                document.getElementById('counterStatus').innerText = '⏸ 一時停止中';
            }
        }

        function addBoost() {
            currentFollowers += 1000;
            updateCounter();
            addLog('⚡ 爆撃ブースト', '+1,000 人');
        }

        function addLog(title, value) {
            const logs = document.getElementById('logs');
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<span>${title}</span><span style="color:#10b981;">${value}</span>`;
            logs.insertBefore(item, logs.firstChild);
        }
    </script>
</body>
</html>
