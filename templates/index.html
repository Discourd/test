<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagramフォロワー爆増シミュレーター</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .instagram-preview {
            background: #fafafa;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .avatar-box {
            position: relative;
            width: 75px;
            height: 75px;
            margin-right: 15px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            font-weight: bold;
            object-fit: cover;
        }
        
        .profile-info {
            text-align: left;
            overflow: hidden;
        }
        
        .profile-name {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 3px;
            word-break: break-all;
        }

        .avatar-hint {
            font-size: 11px;
            color: #888;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #efefef;
        }
        
        .stat-item {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 2px;
            color: #262626;
        }
        
        .stat-label {
            font-size: 11px;
            color: #8e8e8e;
        }
        
        .simulation-controls {
            padding: 20px;
            background: white;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #262626;
        }

        .input-group .sub-note {
            font-size: 11px;
            color: #e6683c;
            font-weight: normal;
            margin-top: 2px;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #0095f6;
        }

        .flex-inputs {
            display: flex;
            gap: 10px;
        }

        .flex-inputs .input-group {
            flex: 1;
        }
        
        .warning-banner {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            transform: translateX(180%);
            transition: transform 0.3s ease-in-out;
            max-width: 320px;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification-content {
            display: flex;
            align-items: center;
        }
        
        .notification-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            margin-right: 10px;
            flex-shrink: 0;
        }
        
        .notification-text {
            font-size: 13px;
            color: #262626;
            font-weight: 500;
        }
        
        .progress-bar {
            height: 6px;
            background: #f0f0f0;
            width: 100%;
            margin-top: 15px;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            width: 0%;
            transition: width 0.1s;
        }
        
        .disclaimer {
            padding: 12px;
            background: #f9f9f9;
            font-size: 11px;
            color: #8e8e8e;
            text-align: center;
            border-top: 1px solid #efefef;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Instagramフォロワー爆増シミュレーター</h1>
            <p>実際のアカウントに影響を与えないデモンストレーションツール</p>
        </div>
        
        <div class="instagram-preview">
            <div class="profile-header">
                <div class="avatar-box" onclick="document.getElementById('fileInput').click()">
                    <div class="profile-pic" id="profilePic">D</div>
                    <img id="avatarImage" class="profile-pic" style="display:none;" alt="アイコン">
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="changeAvatar(event)">

                <div class="profile-info">
                    <div class="profile-name" id="profileName">demo_user</div>
                    <div class="avatar-hint">※ アイコンタップで画像変更可能</div>
                </div>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="followerCount" style="color: #dc2743;">128</div>
                    <div class="stat-label">フォロワー</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="followingCount">256</div>
                    <div class="stat-label">フォロー中</div>
                </div>
            </div>
        </div>
        
        <div class="simulation-controls">
            <div class="input-group">
                <label for="username">ユーザー名</label>
                <input type="text" id="username" placeholder="例: user123" value="demo_user">
            </div>

            <div class="flex-inputs">
                <div class="input-group">
                    <label for="initialFollowers">現在のフォロワー</label>
                    <input type="number" id="initialFollowers" value="128">
                    <div class="sub-note">※違う数値を入力した場合はエラーの原因になります</div>
                </div>
                <div class="input-group">
                    <label for="initialFollowing">フォロー中</label>
                    <input type="number" id="initialFollowing" value="256">
                    <div class="sub-note">※違う数値を入力した場合はエラーの原因になります</div>
                </div>
            </div>
            
            <div class="input-group">
                <label for="targetFollowers">目標フォロワー数</label>
                <input type="number" id="targetFollowers" placeholder="上限1000まで" value="1000">
            </div>
            
            <div class="input-group">
                <label for="growthSpeed">増加速度</label>
                <input type="range" id="growthSpeed" min="1" max="10" value="5" style="width: 100%;">
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: #8e8e8e; margin-top: 4px;">
                    <span>遅い</span>
                    <span>速い</span>
                </div>
            </div>

            <div class="warning-banner">
                ⚠️ スピードが速すぎる場合アカウント凍結の可能性があります。
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" id="startBtn">シミュレーション開始</button>
                <button class="btn btn-secondary" id="resetBtn">リセット</button>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="disclaimer">
            これはデモンストレーション用のシミュレーションツールです。実際のInstagramアカウントには何の影響も与えません。
        </div>
    </div>
    
    <div class="notification" id="notification">
        <div class="notification-content">
            <div class="notification-icon">✓</div>
            <div class="notification-text" id="notificationText">フォロワーが増加しました！</div>
        </div>
    </div>
    
    <script>
        const profileName = document.getElementById('profileName');
        const profilePic = document.getElementById('profilePic');
        const followerCount = document.getElementById('followerCount');
        const followingCount = document.getElementById('followingCount');
        
        const usernameInput = document.getElementById('username');
        const initialFollowersInput = document.getElementById('initialFollowers');
        const initialFollowingInput = document.getElementById('initialFollowing');
        const targetFollowersInput = document.getElementById('targetFollowers');
        const growthSpeedInput = document.getElementById('growthSpeed');
        
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        const progressFill = document.getElementById('progressFill');
        
        let currentFollowers = 128;
        let targetFollowers = 1000;
        let isSimulationRunning = false;
        let simulationInterval;
        let notificationTimeout;

        startBtn.addEventListener('click', startSimulation);
        resetBtn.addEventListener('click', resetSimulation);
        usernameInput.addEventListener('input', updateProfile);
        initialFollowersInput.addEventListener('input', updateStats);
        initialFollowingInput.addEventListener('input', updateStats);
        
        function updateProfile() {
            const val = usernameInput.value.trim().replace('@', '');
            profileName.textContent = val ? '@' + val : '@demo_user';
            if (val) {
                profilePic.textContent = val.charAt(0).toUpperCase();
            }
        }

        function updateStats() {
            if (!isSimulationRunning) {
                currentFollowers = parseInt(initialFollowersInput.value) || 0;
                followerCount.textContent = currentFollowers.toLocaleString();
                followingCount.textContent = (parseInt(initialFollowingInput.value) || 0).toLocaleString();
            }
        }

        function changeAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = document.getElementById('avatarImage');
                    img.src = evt.target.result;
                    img.style.display = 'flex';
                    profilePic.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        // 1時間に3回までの実行制限チェック
        function checkRateLimit() {
            const now = Date.now();
            const history = JSON.parse(localStorage.getItem('sim_history') || '[]');
            // 1時間（3600,000ミリ秒）以内の実行履歴を抽出
            const recent = history.filter(time => now - time < 3600000);
            
            if (recent.length >= 3) {
                return false;
            }
            recent.push(now);
            localStorage.setItem('sim_history', JSON.stringify(recent));
            return true;
        }
        
        function startSimulation() {
            if (isSimulationRunning) return;

            targetFollowers = parseInt(targetFollowersInput.value) || 0;

            // 数値が高すぎる場合のチェック（1000上限）
            if (targetFollowers > 1000) {
                showNotification('数値が高すぎます（目標は1,000までに設定してください）');
                return;
            }

            if (targetFollowers <= currentFollowers) {
                showNotification('目標数は現在のフォロワー数より大きく設定してください');
                return;
            }

            // 回数制限チェック
            if (!checkRateLimit()) {
                showNotification('エラー: 1時間に利用できるのは3回までです。時間を置いてお試しください。');
                return;
            }

            isSimulationRunning = true;
            startBtn.textContent = '実行中...';
            startBtn.disabled = true;
            initialFollowersInput.disabled = true;
            initialFollowingInput.disabled = true;
            
            showNotification('フォロワー増加シミュレーションを開始しました！');
            
            const speed = 11 - parseInt(growthSpeedInput.value);
            const interval = speed * 25; // 1ずつ増やすためテンポを調整
            const startAmount = currentFollowers;
            
            simulationInterval = setInterval(() => {
                if (currentFollowers >= targetFollowers) {
                    clearInterval(simulationInterval);
                    isSimulationRunning = false;
                    startBtn.textContent = 'シミュレーション完了';
                    showNotification(`目標の ${targetFollowers.toLocaleString()} 人に達しました！`);
                    return;
                }
                
                // 1の位から順番に＋1〜＋3ずつ細かく増やす
                const increment = Math.floor(Math.random() * 3) + 1;
                currentFollowers = Math.min(currentFollowers + increment, targetFollowers);
                
                followerCount.textContent = currentFollowers.toLocaleString();
                
                const progress = ((currentFollowers - startAmount) / (targetFollowers - startAmount)) * 100;
                progressFill.style.width = `${Math.min(progress, 100)}%`;
                
            }, interval);
        }
        
        function resetSimulation() {
            if (simulationInterval) {
                clearInterval(simulationInterval);
            }
            
            isSimulationRunning = false;
            startBtn.textContent = 'シミュレーション開始';
            startBtn.disabled = false;
            initialFollowersInput.disabled = false;
            initialFollowingInput.disabled = false;
            
            updateStats();
            progressFill.style.width = '0%';
            
            showNotification('シミュレーションをリセットしました');
        }
        
        function showNotification(message) {
            if (notificationTimeout) clearTimeout(notificationTimeout);
            
            notificationText.textContent = message;
            notification.classList.add('show');
            
            notificationTimeout = setTimeout(() => {
                notification.classList.remove('show');
            }, 3500);
        }

        // 初期表示
        updateProfile();
        updateStats();
    </script>
</body>
</html>
